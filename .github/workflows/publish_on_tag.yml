name: Publish on Tag Push (Pub.dev OIDC)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish-to-pub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Bắt buộc để xác thực OIDC không mật khẩu với pub.dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Dart & Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Verify Package Dry-run
        run: dart pub publish --dry-run

      - name: Publish to pub.dev via OIDC
        run: dart pub publish --force
